name: Bilkent IELTS Takip

on:
  workflow_dispatch:

  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bilkent-ielts-takip
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v6

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: IELTS sayfasını kontrol et
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: >
          dotnet run
          --project IELTSTakipHafif/IELTSTakipHafif.csproj
          --configuration Release
          -- --once

      - name: State dosyasını GitHub'a kaydet
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Kaydedilecek bir değişiklik yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          git commit -m "IELTS takip durumu güncellendi"
          git push